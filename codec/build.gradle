plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'org.slf4j:slf4j-simple:2.0.18'
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation 'pl.edu.icm:JLargeArrays:1.6'
    implementation project(':api')
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}


jar {
    archiveBaseName = 'jmbe'
    manifest {
        attributes('Implementation-Title': rootProject.name,
                'Version': project.version,
                'Site': 'https://github.com/DSheirer/jmbe')
    }
    from rootProject.file('LICENSE')

    //Bundle the frame and error correction classes so that the library also runs in host applications built against
    //an older api that doesn't include them.  The jmbe.iface interfaces must always come from the host application.
    from(project(':api').sourceSets.main.output) {
        exclude 'jmbe/iface/**'
    }

    doLast {
        if(archiveFile.get().asFile.exists())
        {
            println("Your finished JMBE library is located here: " + archiveFile.get().toString())
        }
        else
        {
            println("Failed to create the JMBE library.")
        }
    }
}

test {
    useJUnit()
}
