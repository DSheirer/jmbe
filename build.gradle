apply plugin: 'java'
apply plugin: 'idea'

description = 'JMBE Audio Library build script'

subprojects {
    apply plugin: 'java'

    // CI passes -PjmbeVersion for nightly builds; releases use this value, which the tag must match.
    version = findProperty('jmbeVersion') ?: '3.0.0'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
