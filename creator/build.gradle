plugins {
    id 'java'
    id 'application'
    id 'org.beryx.runtime' version '2.0.1'
}

apply plugin: 'org.beryx.runtime'

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

dependencies {
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'org.slf4j:slf4j-simple:2.0.18'
    implementation 'pl.edu.icm:JLargeArrays:1.6'
}

application {
    mainClass = "io.github.dsheirer.jmbe.creator.Creator"
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

jar {
    manifest {
        attributes 'Implementation-Title': "JMBE",
                   'Implementation-Version': archiveVersion
    }
    from rootProject.file('LICENSE')
}

/**
 * Beryx Runtime plugin - download OS specific JDK and creates a compact OS-specific creator image.
 */
def libericaVersion = '17.0.20.1+1'
def libericaUrl = { String platform, String ext = 'tar.gz' ->
    "https://download.bell-sw.com/java/${libericaVersion}/bellsoft-jdk${libericaVersion}-${platform}.${ext}"
}

runtime {
    targetPlatform("linux-arm32-v" + version)     { jdkHome = jdkDownload(libericaUrl('linux-arm32-vfp-hflt')) }
    targetPlatform("linux-aarch64-v" + version)   { jdkHome = jdkDownload(libericaUrl('linux-aarch64')) }
    targetPlatform("linux-x86_32-v" + version)    { jdkHome = jdkDownload(libericaUrl('linux-i586')) }
    targetPlatform("linux-x86_64-v" + version)    { jdkHome = jdkDownload(libericaUrl('linux-amd64')) }
    targetPlatform("osx-x86_64-v" + version)      { jdkHome = jdkDownload(libericaUrl('macos-amd64')) }
    targetPlatform("osx-aarch64-v" + version)     { jdkHome = jdkDownload(libericaUrl('macos-aarch64')) }
    targetPlatform("windows-aarch64-v" + version) { jdkHome = jdkDownload(libericaUrl('windows-aarch64', 'zip')) }
    targetPlatform("windows-x86_64-v" + version)  { jdkHome = jdkDownload(libericaUrl('windows-amd64', 'zip')) }
    targetPlatform("windows-x86_32-v" + version)  { jdkHome = jdkDownload(libericaUrl('windows-i586', 'zip')) }

    // modules, additive, options, imageZip unchanged
    modules = ['jdk.crypto.ec','java.desktop','jdk.compiler','java.base','jdk.zipfs']
    additive = true
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    imageZip = file("$buildDir/image/jmbe-creator.zip")
}
