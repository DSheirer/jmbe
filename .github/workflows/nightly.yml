# Publishes the rolling "nightly" pre-release from master whenever a commit
# lands there (for example, a merged pull request), or on demand.
#
# A nightly Creator downloads and compiles the source of the exact commit it was
# built from (the commit hash at the end of its version), not the latest release.
name: Nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          base="$(sed -nE "s/.*version = findProperty\('jmbeVersion'\) \?: '([^']+)'.*/\1/p" build.gradle)"
          if [ -z "$base" ]; then
            echo "::error::Couldn't read the version from build.gradle"
            exit 1
          fi
          echo "version=${base}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release delete nightly --cleanup-tag --yes || true
          # Uploading separately with --clobber survives gh retrying an upload
          # that had in fact succeeded; the release is published once complete.
          gh release create nightly --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes "Automated build of master. Not for production use.

          The JMBE Creator in this release builds the library from the source of this same commit.

          Built from ${GITHUB_SHA}"
          gh release upload nightly dist/* --clobber
          gh release edit nightly --draft=false --prerelease --latest=false
